# Alembic configuration. Run from the repo root:
#   .venv/Scripts/python -m alembic -c backend/alembic.ini upgrade head
# The database URL comes from backend.app.config (DATABASE_URL / .env), not from this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
